<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HYBRID Bootloader — OTA Update</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-body: #0d1117;
            --bg-card: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --success: #3fb950;
            --danger: #f85149;
            --radius: 12px; --radius-sm: 8px;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
            --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        }
        html { font-size: 15px; }
        body {
            font-family: var(--font); background: var(--bg-body); color: var(--text);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 20px; line-height: 1.5;
        }
        .container { width: 100%; max-width: 540px; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px 28px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        .header { text-align: center; margin-bottom: 28px; }
        .header .logo {
            width: 56px; height: 56px; background: linear-gradient(135deg, var(--accent), #a371f7);
            border-radius: 14px; display: inline-flex; align-items: center; justify-content: center;
            font-size: 26px; font-weight: 700; color: #fff; margin-bottom: 12px;
        }
        .header h1 { font-size: 1.35rem; font-weight: 600; }
        .header .subtitle { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; }
        .firmware-version {
            display: inline-block; margin-top: 8px; padding: 4px 12px;
            background: rgba(88, 166, 255, 0.1); border: 1px solid rgba(88, 166, 255, 0.2);
            border-radius: 20px; font-size: 0.78rem; font-family: var(--font-mono); color: var(--accent);
        }
        .drop-zone {
            border: 2px dashed var(--border); border-radius: var(--radius-sm);
            padding: 32px 20px; text-align: center; cursor: pointer;
            margin-bottom: 20px;
        }
        .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); background: rgba(88, 166, 255, 0.08); }
        .drop-zone .icon { font-size: 2rem; margin-bottom: 8px; display: block; }
        .drop-zone .label { color: var(--text-muted); font-size: 0.9rem; }
        .drop-zone .label strong { color: var(--accent); }
        .drop-zone .hint { font-size: 0.75rem; color: var(--text-muted); margin-top: 6px; }
        .drop-zone.has-file { border-color: var(--success); border-style: solid; background: rgba(63, 185, 80, 0.06); }
        #fileInput { display: none; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn {
            flex: 1; padding: 12px 16px; border: 1px solid var(--border);
            border-radius: var(--radius-sm); font-size: 0.9rem; font-weight: 500;
            cursor: pointer; text-align: center; user-select: none;
        }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover:not(:disabled) { background: #da3633; }
        .btn-secondary { background: #21262d; color: var(--text); }
        .btn-secondary:hover:not(:disabled) { background: #30363d; }
        .progress-section { display: none; margin-top: 8px; }
        .progress-section.active { display: block; }
        .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 0.82rem; }
        .progress-header .status-text { color: var(--text-muted); }
        .progress-header .percent { font-family: var(--font-mono); font-weight: 600; color: var(--accent); }
        .progress-track { width: 100%; height: 8px; background: #21262d; border-radius: 4px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), #a371f7); transition: width 0.3s ease; }
        .progress-bar.success { background: linear-gradient(90deg, var(--success), #56d364); }
        .progress-bar.error { background: linear-gradient(90deg, var(--danger), #ff6b6b); }
        .status-log { margin-top: 16px; padding: 12px 14px; background: #0d1117; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: var(--font-mono); font-size: 0.78rem; color: var(--text-muted); max-height: 80px; overflow-y: auto; display: none; }
        .status-log.active { display: block; }
        .status-log .ok { color: var(--success); } .status-log .err { color: var(--danger); } .status-log .info { color: var(--accent); }
        /* ── Modal overlay ── */
        .modal-overlay {
            display: none; position: fixed; inset: 0; z-index: 999;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
            align-items: center; justify-content: center; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 36px 32px; max-width: 400px;
            width: 100%; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-icon { font-size: 3rem; margin-bottom: 12px; display: block; }
        .modal-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; }
        .modal-desc { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; line-height: 1.6; }
        .modal-btn {
            display: inline-block; padding: 10px 32px;
            background: var(--success); color: #fff; border: none;
            border-radius: var(--radius-sm); font-size: 0.95rem; font-weight: 600;
            cursor: pointer; transition: background 0.2s;
        }
        .modal-btn:hover { background: #2ea043; }
        @media (max-width: 480px) { body { padding: 12px; } .card { padding: 20px 16px; } .btn-group { flex-direction: column; } }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header">
            <div class="logo">HB</div>
            <h1>HYBRID Bootloader</h1>
            <div class="subtitle">Firmware upgrade via OTA</div>
            <div class="firmware-version" id="fwVer">—</div>
        </div>
        <div class="drop-zone" id="dropZone">
            <span class="icon">📁</span>
            <div class="label" id="dropLabel"><strong>Select</strong> or drop a <strong>.bin</strong> file</div>
            <div class="hint" id="fileInfo"></div>
        </div>
        <input type="file" id="fileInput" accept=".bin">
        <div class="btn-group">
            <button class="btn btn-danger"  id="uploadBtn"  disabled>⬆ Upload &amp; Flash</button>
            <button class="btn btn-secondary" id="cancelBtn">⏻ Go to App</button>
        </div>
        <div class="progress-section" id="progSec">
            <div class="progress-header"><span class="status-text" id="statusText">Starting...</span><span class="percent" id="pctText">0%</span></div>
            <div class="progress-track"><div class="progress-bar" id="progBar"></div></div>
        </div>
        <div class="status-log" id="log"></div>
    </div>
</div>

<!-- ── Success modal ── -->
<div class="modal-overlay" id="successModal">
    <div class="modal-box">
        <span class="modal-icon">✅</span>
        <div class="modal-title">OTA Update Successful</div>
        <div class="modal-desc">
            The new firmware has been flashed successfully.<br>
            The device will reboot momentarily to apply the update.
        </div>
        <button class="modal-btn" id="closeBtn">OK, Close Page</button>
    </div>
</div>
<script>
(function(){
    var $ = function(id){return document.getElementById(id);};
    var dz=$("dropZone"), dl=$("dropLabel"), fi=$("fileInfo"), inp=$("fileInput");
    var ub=$("uploadBtn"), cb=$("cancelBtn"), ps=$("progSec"), st=$("statusText");
    var pt=$("pctText"), pb=$("progBar"), lg=$("log"), fw=$("fwVer");
    var mo=$("successModal"), cl=$("closeBtn");
    var file=null, uploading=false;

    function l(m,t){var d=document.createElement("div");d.textContent="> "+m;if(t)d.className=t;lg.appendChild(d);lg.scrollTop=lg.scrollHeight;}
    function sp(p,t,c){var n=Math.min(100,Math.max(0,p));pt.textContent=n+"%";pb.style.width=n+"%";if(t)st.textContent=t;pb.className="progress-bar"+(c?" "+c:"");}

    dz.onclick=function(){inp.click();};
    dz.ondragover=function(e){e.preventDefault();dz.classList.add("dragover");};
    dz.ondragleave=function(){dz.classList.remove("dragover");};
    dz.ondrop=function(e){
        e.preventDefault();dz.classList.remove("dragover");
        var f=e.dataTransfer.files[0];
        if(f&&f.name.endsWith(".bin")){
            file=f;var s=f.size<1e6?(f.size/1024).toFixed(1)+" KB":(f.size/1e6).toFixed(2)+" MB";
            fi.innerHTML="<strong>"+f.name+"</strong> &middot; "+s;
            dz.classList.add("has-file");dl.style.display="none";ub.disabled=false;
            l("File: "+f.name+" ("+s+")","info");
        }else l("Only .bin files supported","err");
    };
    inp.onchange=function(){if(this.files[0])dz.ondrop({preventDefault:function(){},dataTransfer:{files:this.files}});};

    cb.onclick=function(){cb.disabled=true;cb.textContent="Redirecting...";fetch("/goapp",{method:"POST",body:"goapp"}).catch(function(){}).finally(function(){setTimeout(function(){cb.disabled=false;cb.textContent="Go to App";},3000);});};

    ub.onclick=function(){
        if(!file||uploading)return;
        uploading=true;ub.disabled=true;cb.disabled=true;
        ps.classList.add("active");lg.classList.add("active");lg.innerHTML="";
        sp(0,"Uploading firmware...");l("Starting OTA...","info");
        var fd=new FormData();fd.set("file",file,file.name);
        var x=new XMLHttpRequest();x.open("POST","/update",true);x.responseType="blob";
        x.upload.onprogress=function(e){if(e.lengthComputable){var p=Math.round(e.loaded/e.total*100);sp(p,"Uploading... "+p+"%");}};
        x.onloadend=function(){if(x.readyState==4){if(x.status==200){sp(100,"Firmware flashed. Rebooting...","success");l("OTA complete. Rebooting...","ok");mo.classList.add("active");}else{sp(100,"Update failed","error");l("HTTP "+x.status,"err");}}uploading=false;cb.disabled=false;setTimeout(function(){ub.disabled=true;},500);};
        x.onerror=function(){sp(0,"Connection error","error");l("Network error.","err");uploading=false;cb.disabled=false;};
        x.send(fd);
    };

    /* Close modal → tell device to reboot, then close page */
    cl.onclick=function(){
        cl.disabled=true;
        cl.textContent="Rebooting...";
        /* Send /goapp to trigger reboot */
        fetch("/goapp",{method:"POST",body:"goapp"}).catch(function(){});
        /* Give the request a moment, then close tab */
        setTimeout(function(){mo.classList.remove("active");window.close();},500);
    };

    function poll(){
        var x=new XMLHttpRequest();x.open("POST","/status",true);x.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
        x.onreadystatechange=function(){if(x.readyState==4&&x.status==200){try{var j=JSON.parse(x.responseText);fw.textContent="Firmware: "+j.compile_date+" "+j.compile_time;if(j.status==1)l("Previous OTA completed.","ok");else if(j.status==-1)l("Previous OTA failed","err");}catch(_){}}};
        x.send("status");
    }
    poll();setTimeout(poll,1500);
})();
</script>
</body>
</html>
